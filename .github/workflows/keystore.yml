name: Buat Keystore (sekali saja)

on:
  workflow_dispatch:

jobs:
  keystore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Buat keystore
        run: |
          PASS="$(openssl rand -hex 12)"
          echo "::add-mask::$PASS"
          keytool -genkeypair -v -keystore upload.jks -alias upload -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$PASS" -keypass "$PASS" \
            -dname "CN=Billiard Business, OU=Game, O=Studio, L=Jakarta, ST=DKI Jakarta, C=ID"
          base64 -w0 upload.jks > KEYSTORE_BASE64.txt
          printf 'KEYSTORE_PASSWORD=%s\nKEY_PASSWORD=%s\nKEY_ALIAS=upload\n' "$PASS" "$PASS" > RAHASIA.txt

      - name: Simpan sebagai Artifact (berlaku 1 hari)
        uses: actions/upload-artifact@v4
        with:
          name: keystore-RAHASIA
          path: |
            upload.jks
            KEYSTORE_BASE64.txt
            RAHASIA.txt
          retention-days: 1
          
