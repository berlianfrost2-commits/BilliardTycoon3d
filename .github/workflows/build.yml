name: Build APK dari ZIP

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cari dan ekstrak ZIP (nama bebas)
        run: |
          echo "File di repo:"; ls -la
          ZIP="$(find . -maxdepth 2 -iname '*.zip' | head -1)"
          if [ -z "$ZIP" ]; then echo "ERROR: tidak ada file .zip di repo. Unggah zip-nya dulu."; exit 1; fi
          echo "Memakai: $ZIP"
          mkdir -p /tmp/src && unzip -q "$ZIP" -d /tmp/src
          CFG="$(find /tmp/src -name capacitor.config.json -not -path '*/node_modules/*' | head -1)"
          if [ -z "$CFG" ]; then echo "ERROR: capacitor.config.json tidak ditemukan di zip"; exit 1; fi
          echo "APP_DIR=$(dirname "$CFG")" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dan siapkan
        working-directory: ${{ env.APP_DIR }}
        run: |
          npm install
          npm run copy-three
          npx cap add android
          npx cap sync android

      - name: Build APK debug
        working-directory: ${{ env.APP_DIR }}/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Ganti nama APK
        run: cp "$APP_DIR/android/app/build/outputs/apk/debug/app-debug.apk" BilliardTycoon3D.apk

      - name: Upload APK (Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: BilliardTycoon3D-apk
          path: BilliardTycoon3D.apk

      - name: Rilis APK (tab Releases)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: terbaru
          name: Billiard Tycoon 3D (build terbaru)
          files: BilliardTycoon3D.apk
          
